name: Build SnipBoard
on:
  workflow_dispatch:
  push:
    paths: ['snipboard/**', '.github/workflows/snipboard-build.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: snipboard
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: SnipBoard-Windows, path: snipboard/dist/*.exe }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with: { name: SnipBoard-Android, path: snipboard/android/app/build/outputs/apk/debug/app-debug.apk }
